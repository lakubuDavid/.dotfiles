[language-server]
emmet-ls = { command = "emmet-ls", args = ["--stdio"] }
taplo = { command = "taplo", args = ["lsp", "stdio"] }
tombi = { command = "tombi", args = ["lsp"] }
sql-language-server = { command = "sql-language-server", args = [
  "up",
  "--method",
  "stdio",
] }
vscode-json-language-server = { command = "vscode-json-language-server", args = [
  "--stdio",
], config = { provideFormatter = true, json = { validate = { enable = true } } } }
# gpt = { command = "bun", args = ["run", "~/bun/helix-gpt.js"] }
gpt = { command = "helix-gpt" }
omnisharp = { command = "omnisharp", args = ["--languageserver"] }
templ-lsp = { command = "templ", args = ["lsp"] }
# teal-lsp = { command = "teal-language-server" }
superhtml = { command = "superhtml", args = ["lsp"] }
vscode-html-language-server = { command = "vscode-html-language-server", args = [
  "--stdio",
], config = { provideFormatter = true } }
tsgo = { command = "tsgo", args = ["--lsp", "--stdio"] }
[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]
[language-server.teal-lsp]
command = "teal-language-server"

[language-server.teal-lsp.config]
plugins = []
workspace_config = []
[language-server.lua-language-server]
command = "lua-language-server"

[language-server.lua-language-server.config.Lua.hint]
enable = true
arrayIndex = "Enable"
setType = true
paramName = "All"
paramType = true
await = true

[language-server.lua-language-server.config.Lua]
# For Windows user: find the correspondent path of /usr/lib/lua-language-server/meta/3rd/love2d
workspace.library = [
  "/Users/davidlakubu/.lualspaddons/love2d/library",
  "/Users/davidlakubu/lsp/lua/addons/xmake-luals-addon/library",
]
[language-server.ruff]
command = "ruff"
args = ["server"]
[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.pyright.config]
python.analysis.venvPath = "."
python.analysis.venv = ".venv"
python.analysis.lint = true
python.analysis.inlayHint.enable = true
python.analysis.autoSearchPaths = true
python.analysis.diagnosticMode = "workspace"
python.analysis.useLibraryCodeForType = true
python.analysis.logLevel = "Error"
python.analysis.typeCheckingMode = "off"
python.analysis.autoImoprtCompletion = true
python.analysis.reportOptionalSubscript = false
python.analysis.reportOptionalMemberAccess = false

[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

[language-server.basedpyright.config]
# basedpyright.analysis.diagnosticMode = "openFilesOnly"
basedpyright.analysis.lint = true
basedpyright.analysis.inlayHint.enable = true
basedpyright.analysis.autoSearchPaths = true
basedpyright.analysis.diagnosticMode = "workspace"
basedpyright.analysis.useLibraryCodeForType = true
basedpyright.analysis.logLevel = "Error"
basedpyright.analysis.typeCheckingMode = "off"
basedpyright.analysis.autoImoprtCompletion = true
basedpyright.analysis.reportOptionalSubscript = false
basedpyright.analysis.reportOptionalMemberAccess = false
[language-server.lsp-ai]
command = "lsp-ai"
[language-server.biome]
command = "biome"
args = ["lsp-proxy"]
[language-server.biome.json.parser]
allowTrailingCommas = true
allowComments = true
[language-server.biome.json.formatter]
enabled = true
indentStyle = "space"
idnentWidth = 2

[language-server.lsp-ai.config.memory]
file_store = {}

[language-server.lsp-ai.config.models.model1]
type = "ollama"
model = "smollm:mini"
max_requests_per_second = 1

[language-server.lsp-ai.config.completion]
model = "model1"

[language-server.lsp-ai.config.completion.parameters]
# max_tokens = 32
max_context = 2000

[language-server.lsp-ai.config.completion.parameters.options]
num_predict = 32
# introduce new language server
[language-server.scls]
command = "simple-completion-language-server"

[language-server.scls.config]
max_completion_items = 20    # set max completion results len for each group: words, snippets, unicode-input
snippets_first = true        # completions will return before snippets by default
feature_words = true         # enable completion by word
feature_snippets = true      # enable snippets
feature_unicode_input = true # enable "unicode input"
feature_paths = true         # enable path completion


# write logs to /tmp/completion.log
[language-server.scls.environment]
RUST_LOG = "info,simple-completion-language-server=info"
LOG_FILE = "/tmp/completion.log"

[language-server.typescript-language-server.config]
plugins = [
  { name = "@vue/typescript-plugin", location = "/usr/local/lib/node_modules/@vue/language-server", languages = [
    "vue",
  ] },
]

tsserver = { path = "./node_modules/typescript/lib" }
typescript = { tsdk = "./node_modules/typescript/lib" }
[language-server.godot]
command = "nc"
args = ["127.0.0.1", "6005"]
[language-server.gdscript-formatter]
command = "gdscript-formatter"
args = ["lint"]

[language-server.eslint]
command = "vscode-eslint-language-server"
args = ["--stdio"]
[language-server.eslint.config]
codeActionsOnSave = { mode = "all", "source.fixAll.eslint" = true }
format = { enable = true }
nodePath = ""
quiet = false
rulesCustomizations = []
run = "onType"
validate = "on"
experimental = {}
problems = { shortenToSingleLine = false }

[language-server.eslint.config.codeAction]
disableRuleComment = { enable = true, location = "separateLine" }
showDocumentation = { enable = true }

[[language]]
name = "csv"
file-types = ["csv"]
scope = "source.csv"

[[grammar]]
name = "csv"
source.git = "https://github.com/weartist/rainbow-csv-tree-sitter"
source.rev = "896e6d09b23a1b0d87e45bf97ca34a249f41495c"
[[grammar]]
name = "teal"
source = { git = "https://github.com/lakubudavid/tree-sitter-teal-4-hx", rev = "ef6ccbb1a18eeb502c6785c6147ea226135e0753" }
[[language]]
name = "templ"
auto-format = true
scope = "source.templ"
injection-regex = "templ"
grammar = "templ"
file-types = ["templ"]
roots = ["go.sum"]
# comment-tokens = ["//"]
indent = { tab-width = 4, unit = "\t" }
language-servers = ["templ", "scls"]
formatter = { command = "templ", args = ["fmt"] }
[[language]]
name = "python"
scope = "source.python"
injection-regex = "python"
file-types = [
  "py",
  "pyi",
  "py3",
  "pyw",
  "ptl",
  "rpy",
  "cpy",
  "ipy",
  "pyt",
  { glob = ".python_history" },
  { glob = ".pythonstartup" },
  { glob = ".pythonrc" },
  { glob = "SConstruct" },
  { glob = "SConscript" },
]
shebangs = ["python"]
roots = [
  "pyproject.toml",
  "setup.py",
  "poetry.lock",
  "pyrightconfig.json",
  "requirements.txt",
  ".venv/",
]
comment-token = "#"
language-servers = [
  "ruff",
  "jedi",
  { name = "basedpyright", except-features = ["diagnostics"] },
  # { name = "pyright", except-features = [
  #   "diagnostics",
  # ] },
]
auto-format = true

[[language]]
name = "gdscript"
language-servers = ["godot", "gdscript-formatter"]
formatter = { command = "gdscript-formatter", args = [
  # "--reorder-code",
  "--use-spaces",
  "--indent-size",
  "2",
  "--safe",
] }
auto-format = true

[[language]]
name = "go"
auto-format = true
formatter = { command = "goimports" }

[[language]]
name = "toml"
auto-format = true
language-servers = ["scls", "taplo", "tombi"]
formatter = { command = "taplo", args = ["fmt", "-"], formatStdin = true }

[[language]]
name = "json"
formatter = { command = "jq", args = ["--indent", "2"], formatStdin = true }
language-servers = ["vscode-json-language-server"]                           #, "biome"]
# formatter = { command = "biome", args = ["format"], formatStdin = false }

[[language]]
name = "javascript"
language-servers = [
  # "tsgo",
  "typescript-language-server",
  # "eslint",
  # "biome",
  "emmet-ls",
]
formatter = { command = "prettier", args = ["--parser", "typescript"] }
# formatter = { command = "dprint", args = ["fmt", "--stdin", "javascript"] }
# auto-format = true
# formatter = { command = "prettier", args = [
#   "--parser",
#   "typescript",
# ], formatStdin = true }
# language-servers = ["typescript-language-server", "gpt"]

[[language]]
name = "typescript"
language-servers = [
  # "tsgo",
  # "biome",
  "typescript-language-server",
  "emmet-ls",
]
# formatter = { command = "dprint", args = ["fmt", "--stdin", "typescript"] }
formatter = { command = "prettier", args = [
  "--parser",
  "typescript",
], formatStdin = true }
# language-servers = ["typescript-language-server", "gpt"]
[[language]]
name = "tsx"
language-servers = ["typescript-language-server", "eslint", "emmet-ls"]
formatter = { command = "prettier", args = ["--parser", "typescript"] }
# formatter = { command = "dprint", args = ["fmt", "--stdin", "tsx"] }
[[language]]
name = "jsx"
language-servers = ["typescript-language-server", "eslint", "emmet-ls"]
formatter = { command = "prettier", args = ["--parser", "typescript"] }
# formatter = { command = "dprint", args = ["fmt", "--stdin", "jsx"] }

[language-server.volar]
command = "vue-language-server"
args = ["--stdio"]

[language-server.volar.config]
typescript = { tsdk = "./node_modules/typescript/lib" }
vue = { hybridMode = false }
# typescript = { tsdk = "" }

[language-server.coffee]
command = "coffeesense-language-server"
args = ["--stdio"]

[[language]]
name = "vue"
auto-format = true
scope = "source.vue"
injection-regex = "vue"
file-types = ["vue"]
# language-servers = ["volar", "typescript-language-server", "emmet-ls", "scls"]
language-servers = ["typescript-language-server", "emmet-ls", "scls"]
formatter = { command = 'prettier', args = ["--parser", "vue"] }
roots = [
  "package.json",
  "vue.config.js",
  "vite.config.js",
  "nuxt.config.js",
  ".prettierrc",
  ".prettierrc.js",
  ".prettierrc.json",
  ".prettierrc.yaml",
  ".prettierrc.yml",
  ".prettierrc.toml",
  ".prettierrc.cjs",
]
[[language]]
name = "lua"
injection-regex = "lua"
scope = "source.lua"
file-types = ["lua"]
shebangs = ["lua", "luajit"]
roots = [".luarc.json", ".luacheckrc", ".stylua.toml", "selene.toml", ".git"]
# comment-tokens = "--"
# block-comment-tokens = { start = "--[[", end = "--]]" }
indent = { tab-width = 2, unit = "  " }
language-servers = ["lua-language-server"]
[[language]]
name = "html"
scope = "text.html.basic"
injection-regex = "html"
file-types = [
  "html",
  "htm",
  "shtml",
  "xhtml",
  "xht",
  "jsp",
  "asp",
  "aspx",
  "jshtm",
  "volt",
  "rhtml",
  "cshtml",
]
# block-comment-tokens = { start = "<!--", end = "-->" }
language-servers = ["vscode-html-language-server", "superhtml", "emmet-ls"]
auto-format = false
indent = { tab-width = 2, unit = "  " }
[[language]]
name = "teal"
scope = "source.tl"
# injection-regex = "teal"
file-types = ["tl"]
# shebangs = ["teal"]
roots = ["tlconfig.lua"]
comment-tokens = "--"
block-comment-tokens = { start = "--[[", end = "--]]" }
indent = { tab-width = 2, unit = "  " }
language-servers = ["teal-lsp", "scls"]
# [[language]]
# name = "teal"
# scope = "source.tl"
# injection-regex = "teal"
# file-types = ["tl"]
# comment-tokens = "--"
# block-comment-tokens = { start = "--[[", end = "--]]" }
# roots = [ "tlconfig.lua" ]
# language-servers = [ "teal-language-server" ]
[[language]]
name = "sql"
language-servers = ["sql-language-server"]
formatter = { command = "sql-formatter", formatStdin = true }
[[language]]
name = "c-sharp"
scope = "source.csharp"
injection-regex = "c-sharp"
file-types = ["cs", "csx", "cake"]
roots = ["sln", "csproj"]
# comment-tokens = "//"
# block-comment-tokens = { start = "/*", end = "*/" }
indent = { tab-width = 4, unit = "\t" }
# language-servers = ["omnisharp", "scls"]
language-servers = ["csharp-ls", "scls"]
# language-servers = ["omnisharp"]
[[language]]
name = "git-commit"
language-servers = ["scls"]

# etc..

# introduce a new language to enable completion on any doc by forcing set language with :set-language stub
[[language]]
name = "stub"
scope = "text.stub"
file-types = []
shebangs = []
roots = []
auto-format = false
language-servers = ["scls"]

[[language]]
name = "coffeescript"
scope = "source.coffee"
injection-regex = "(coffee|coffeescript)"
file-types = ["coffee"]
shebangs = []
roots = []
language-servers = ["coffee", "scls"]
indent = { tab-width = 2, unit = " " }
[[language]]
name = "markdown"
scope = "source.md"
injection-regex = "md|markdown"
file-types = [
  "md",
  "livemd",
  "markdown",
  "mdx",
  "mkd",
  "mkdn",
  "mdwn",
  "mdown",
  "markdn",
  "mdtxt",
  "mdtext",
  "workbook",
  { glob = "PULLREQ_EDITMSG" },
]
roots = [".marksman.toml"]
language-servers = ["marksman", "markdown-oxide", "rumdl", "harper-ls"]
indent = { tab-width = 2, unit = "  " }
block-comment-tokens = { start = "<!--", end = "-->" }
# word-completion.trigger-length = 4
[[language]]
name = "typst"
scope = "source.typst"
injection-regex = "typ(st)?"
file-types = ["typst", "typ"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
language-servers = ["tinymist", "harper-ls"]
indent = { tab-width = 2, unit = "  " }
