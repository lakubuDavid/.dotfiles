+/**
+ * Reindex all documents by triggering embedding workflows for every file.
+ * Each file gets its own workflow instance so they can run concurrently.
+ */
+export const reindexAllDocumentsServerFn = createServerFn({ method: 'POST' })
+  .middleware([adminMiddleware])
+  .handler(async ({ context }) => {
+    const { logger } = context as AdminContext & LoggerContext
+
+    // Fetch all files (use a large limit to get everything)
+    const [filesResult, listError] = await tryCatchAsync(() =>
+      listFiles({ limit: 100, offset: 0 }),
+    )
+
+    if (listError) {
+      logger?.error('[server.embeddings] Failed to list files for reindex', {
+        error: listError.message,
+      })
+      throw listError
+    }
+
+    const files = filesResult?.data ?? []
+    if (files.length === 0) {
+      return {
+        success: true,
+        queued: 0,
+        errors: [] as Array<{ fileId: string; error: string }>,
+      }
+    }
+
+    const workflow = env.DOCUMENT_EMBEDDING_WORKFLOW
+    const results: Array<{ fileId: string; workflowId: string }> = []
+    const errors: Array<{ fileId: string; error: string }> = []
+
+    for (const file of files) {
+      const workflowId = `${file.id}-${Date.now()}`
+
+      const [instance, createError] = await tryCatchAsync(() =>
+        workflow.create({
+          id: workflowId,
+          params: {
+            filename: file.filename,
+            fileId: file.id,
+          },
+        }),
+      )
+
+      if (createError || !instance) {
+        const msg = createError?.message ?? 'Unknown error'
+        logger?.error('[server.embeddings] Failed to start workflow for file', {
+          fileId: file.id,
+          error: msg,
+        })
+        errors.push({ fileId: file.id, error: msg })
+        continue
+      }
+
+      // Track the workflow in KV (non-fatal if it fails)
+      await tryCatchAsync(() =>
+        trackWorkflow({
+          workflowId: instance.id,
+          fileId: file.id,
+          filename: file.filename,
+        }),
+      )
+
+      results.push({ fileId: file.id, workflowId: instance.id })
+    }
+
+    logger?.info('[server.embeddings] Reindex all complete', {
+      queued: results.length,
+      errors: errors.length,
+    })
+
+    return {
+      success: true,
+      queued: results.length,
+      errors,
+    }
+  })
